<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1X BID</title>

    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Layered background video (replace ../images/aurora.mp4 with your file) -->
    <div class="bg-video-wrap">
        <video id="bgVideo" class="bg-video" autoplay muted loop playsinline preload="auto">
            <source src="../videos/aurora.mp4" type="video/mp4" />
            Your browser does not support the video tag.
        </video>
        <div class="bg-overlay"></div>
        <div class="bg-video-fallback" aria-hidden="true"></div>
    </div>
    <div class="panel">

        <div class="topbar">
            <div class="logo">
                <img src="../images/Logo.png" alt="1X BID Logo" />
            </div>

            <div class="nav-actions">
                <button class="btn">Log in</button>
                <a href="SignUp.html">
                <button class="btn signup">Sign up</button>
                </a>
            </div>
        </div>

        <div class="center">
            <div class="stack">
                <h1>Go <span class="accent">BID</span> or Go Home</h1>

                <form class="pill" id="pill" onsubmit="return false;">
                    <div class="field">
                        <input id="email" type="email" placeholder="Enter Your Email..." />
                    </div>
                    <button class="cta">Sign Up</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
